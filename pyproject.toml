[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysperf"
version = "5.4.4"
description = "Self-improving Windows 11 performance dashboard: measures the machine, learns which remediations actually work, proposes new ones from evidence, and states plainly what it needs a human to do."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SysPerf contributors" }]
keywords = [
    "windows", "windows11", "performance", "monitoring", "dashboard",
    "diagnostics", "optimization", "wsl", "advisor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "Flask==3.1.3",
    "waitress==3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "uv==0.13.5",
]

[project.urls]
Homepage = "https://github.com/buildsbeyondai-code/WindowsAI"
Documentation = "https://github.com/buildsbeyondai-code/WindowsAI#readme"
Issues = "https://github.com/buildsbeyondai-code/WindowsAI/issues"
Source = "https://github.com/buildsbeyondai-code/WindowsAI"

[project.scripts]
sysperf = "sysperf.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sysperf = ["static/*.html", "*.ps1", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are caught by the formatter, not the linter
    "B008",    # function calls in argument defaults are used deliberately here
    "RUF001",  # typographic dashes and quotes are intentional in user-facing text
    "RUF002",
    "RUF003",
    "SIM105",  # try/except/pass keeps its comment and coverage pragma on the except line
    "RUF012",  # class-level constant tables are never mutated; ClassVar adds only noise
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
