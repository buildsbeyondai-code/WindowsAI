name: Import SysPerf source v2

on:
  push:
    branches: [main]
    paths:
      - '.sysperf-import/**'
      - '.github/workflows/import-sysperf-v2.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check payload
        id: payload
        shell: bash
        run: |
          count=$(find .sysperf-import -maxdepth 1 -name 'part-*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Extract and promote source
        if: steps.payload.outputs.count == '24'
        shell: bash
        run: |
          cat .sysperf-import/part-* | base64 --decode > /tmp/SysPerf-2.1.0.tar.gz
          rm -rf /tmp/sysperf-import
          mkdir -p /tmp/sysperf-import
          tar -xzf /tmp/SysPerf-2.1.0.tar.gz -C /tmp/sysperf-import
          cp -a /tmp/sysperf-import/SysPerf-2.1.0/. .
          rm -rf .sysperf-import SysPerf-2.1.0.tar.gz
          rm -f .github/workflows/import-sysperf.yml .github/workflows/import-sysperf-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import SysPerf 2.1.0 source tree'
          git push origin HEAD:main
