name: MSIX

# Store packages for both Windows architectures. PyInstaller freezes with the
# interpreter it runs under, so the Arm64 package is built on an Arm64 runner.
# Upload both artifacts to the same Partner Center submission. A version tag
# also publishes them as a GitHub Release, downloadable without signing in.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Candidate branches get both native builds and the frozen smoke run. The
    # release job below runs only for v* tags, so this publishes nothing.
    branches: ['impl/**']
  # Changes on the frozen app's path get both builds before they reach main:
  # the entry point, the one-shot CLI and the collector it runs (5.5.0 audit:
  # a CLI-only change bypassed this gate).
  pull_request:
    paths: ['packaging/msix/**', '.github/workflows/msix.yml', 'requirements.lock',
            'src/sysperf/cli.py', 'src/sysperf/collector.py', 'src/sysperf/collect_win.ps1',
            'src/sysperf/desktop.py', 'src/sysperf/selfupdate.py', 'src/sysperf/config.py',
            'src/sysperf/platform_paths.py', 'src/sysperf/__main__.py']

permissions:
  contents: read

env:
  # Partner Center > Product management > Product identity.
  IDENTITY_NAME: JudeFinney.SysPerfPCPerformanceAgent
  PUBLISHER: CN=E915F59E-531D-4192-827B-41D3234152B5
  PUBLISHER_DISPLAY_NAME: Jude Finney
  DISPLAY_NAME: 'SysPerf: PC Performance Agent'

jobs:
  msix:
    name: msix (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, machine: 0x8664 }
          - { arch: arm64, runner: windows-11-arm, machine: 0xAA64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: '3.13'

      - name: Build
        shell: pwsh
        run: |
          ./packaging/msix/build-msix.ps1 -Arch ${{ matrix.arch }} `
            -Python '${{ steps.py.outputs.python-path }}' `
            -OutDir (Join-Path $env:RUNNER_TEMP msix) `
            -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER `
            -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME -DisplayName $env:DISPLAY_NAME

      - name: Package and executable are ${{ matrix.arch }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP msix
          $manifest = [xml](Get-Content -Raw (Join-Path $out layout/AppxManifest.xml))
          $arch = $manifest.Package.Identity.ProcessorArchitecture
          if ($arch -ne '${{ matrix.arch }}') { throw "manifest says $arch" }
          # PE header: e_lfanew at 0x3C, then 'PE\0\0', then the machine type.
          $b = [IO.File]::ReadAllBytes((Join-Path $out layout/SysPerf/SysPerf.exe))
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          if ($machine -ne ${{ matrix.machine }}) { throw ('SysPerf.exe machine 0x{0:X4}' -f $machine) }
          Get-ChildItem $out -Filter *.msix | ForEach-Object {
            "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB  $((Get-FileHash $_.FullName).Hash)" }

      - name: The frozen ${{ matrix.arch }} app runs here (one real sample)
        shell: pwsh
        run: |
          # Failures are published as annotations (public; the job log is not), with
          # the exit code, the start of the output and the app's own log (5.5.1).
          function Fail($why) {
            $log = Join-Path $env:LOCALAPPDATA 'SysPerf/app.log'
            $tail = if (Test-Path $log) { (Get-Content $log -Tail 12) -join ' | ' } else { 'no app.log' }
            $msg = "$why || app.log: $tail" -replace "`r?`n", ' '
            Write-Output "::error title=Smoke ${{ matrix.arch }}::$($msg.Substring(0, [Math]::Min(900, $msg.Length)))"
            exit 1
          }
          $exe = Join-Path $env:RUNNER_TEMP msix/layout/SysPerf/SysPerf.exe
          $out = Join-Path $env:RUNNER_TEMP smoke.json
          $p = Start-Process $exe -ArgumentList "--smoke `"$out`"" -PassThru   # quoted: paths may hold spaces
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Fail 'SysPerf.exe --smoke did not finish in 5 minutes' }
          $body = if (Test-Path $out) { Get-Content -Raw $out } else { '' }
          if ($p.ExitCode -ne 0 -or -not $body) {
            Fail "exit code $($p.ExitCode); output: $($body.Substring(0, [Math]::Min(300, $body.Length)))"
          }
          try { $j = $body | ConvertFrom-Json } catch { Fail "output is not JSON: $($body.Substring(0, [Math]::Min(300, $body.Length)))" }
          if ($null -eq $j.available_mb) { Fail "no available_mb in the sample: $($body.Substring(0, [Math]::Min(300, $body.Length)))" }
          "cpu $($j.cpu_pct)%  available $($j.available_mb) MB  processes $($j.processes)"

      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: ${{ runner.temp }}/msix/*.msix
          if-no-files-found: error

  release:
    name: GitHub release
    needs: msix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          merge-multiple: true
          path: dist

      - name: Release notes from the CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v " 'index($0, h) == 1 {p = 1; next} /^## / {if (p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }

      - name: Checksums
        working-directory: dist
        run: sha256sum *.msix | tee SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SysPerf ${GITHUB_REF_NAME#v}" --notes-file notes.md
