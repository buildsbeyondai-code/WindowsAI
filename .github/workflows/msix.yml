name: MSIX

# Store packages for both Windows architectures. PyInstaller freezes with the
# interpreter it runs under, so the Arm64 package is built on an Arm64 runner.
# Upload both artifacts to the same Partner Center submission. A version tag
# also publishes them as a GitHub Release, downloadable without signing in.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # Packaging changes get both builds before they reach main.
  pull_request:
    paths: ['packaging/msix/**', '.github/workflows/msix.yml', 'requirements.lock']

permissions:
  contents: read

env:
  # Partner Center > Product management > Product identity.
  IDENTITY_NAME: JudeFinney.SysPerfPCPerformanceAgent
  PUBLISHER: CN=E915F59E-531D-4192-827B-41D3234152B5
  PUBLISHER_DISPLAY_NAME: Jude Finney
  DISPLAY_NAME: 'SysPerf: PC Performance Agent'

jobs:
  msix:
    name: msix (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, machine: 0x8664 }
          - { arch: arm64, runner: windows-11-arm, machine: 0xAA64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: '3.13'

      - name: Build
        shell: pwsh
        run: |
          ./packaging/msix/build-msix.ps1 -Arch ${{ matrix.arch }} `
            -Python '${{ steps.py.outputs.python-path }}' `
            -OutDir (Join-Path $env:RUNNER_TEMP msix) `
            -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER `
            -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME -DisplayName $env:DISPLAY_NAME

      - name: Package and executable are ${{ matrix.arch }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP msix
          $manifest = [xml](Get-Content -Raw (Join-Path $out layout/AppxManifest.xml))
          $arch = $manifest.Package.Identity.ProcessorArchitecture
          if ($arch -ne '${{ matrix.arch }}') { throw "manifest says $arch" }
          # PE header: e_lfanew at 0x3C, then 'PE\0\0', then the machine type.
          $b = [IO.File]::ReadAllBytes((Join-Path $out layout/SysPerf/SysPerf.exe))
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          if ($machine -ne ${{ matrix.machine }}) { throw ('SysPerf.exe machine 0x{0:X4}' -f $machine) }
          Get-ChildItem $out -Filter *.msix | ForEach-Object {
            "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB  $((Get-FileHash $_.FullName).Hash)" }

      - name: The frozen ${{ matrix.arch }} app runs here (one real sample)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP msix/layout/SysPerf/SysPerf.exe
          $out = Join-Path $env:RUNNER_TEMP smoke.json
          $p = Start-Process $exe -ArgumentList '--smoke', $out -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "SysPerf.exe --smoke exited $($p.ExitCode)" }
          $j = Get-Content -Raw $out | ConvertFrom-Json
          if ($null -eq $j.cpu_pct -or $null -eq $j.available_mb) { throw "no live sample: $(Get-Content -Raw $out)" }
          "cpu $($j.cpu_pct)%  available $($j.available_mb) MB  processes $($j.processes)"

      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: ${{ runner.temp }}/msix/*.msix
          if-no-files-found: error

  release:
    name: GitHub release
    needs: msix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          merge-multiple: true
          path: dist

      - name: Release notes from the CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v " 'index($0, h) == 1 {p = 1; next} /^## / {if (p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }

      - name: Checksums
        working-directory: dist
        run: sha256sum *.msix | tee SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SysPerf ${GITHUB_REF_NAME#v}" --notes-file notes.md
